name: Build site data (refresh download counts)

# Rebuilds data/data.js so the download counters pick up real GitHub
# release download counts. Runs on every push, on a schedule, and on demand.
on:
  push:
    branches: [ main ]
    paths-ignore:
      - 'data/data.js'
  schedule:
    - cron: '0 */6 * * *'   # every 6 hours
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-data
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Pillow (image luminance)
        run: python -m pip install --quiet Pillow

      - name: Build data.js
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/build.py

      - name: Commit refreshed data.js
        run: |
          git config user.name  "blacklemon-bot"
          git config user.email "actions@users.noreply.github.com"
          if ! git diff --quiet -- data/data.js; then
            git add data/data.js
            git commit -m "chore: refresh download counts [skip ci]"
            git push
          else
            echo "No change in data/data.js"
          fi
